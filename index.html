<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국수사과 · 전투</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
  <main id="game-shell">
    <section id="hud" aria-label="전투 정보">
      <div class="unit player"><span class="portrait">국</span><div><b>플레이어</b><div class="bar"><i id="player-hp"></i></div><small id="player-stats"></small></div></div>
      <div id="message" aria-live="polite">전투를 시작합니다.</div>
      <div class="unit enemy"><div><b>고철 수호자</b><div class="bar"><i id="enemy-hp"></i></div><small id="enemy-intent"></small></div><span class="portrait enemy-portrait">적</span></div>
    </section>
    <section id="battle" aria-label="전투 무대"><div id="phaser-stage"></div></section>
    <section id="hand-area" aria-label="손패"><div id="piles"></div><div id="hand"></div><button id="end-turn">턴 종료</button></section>
    <section id="choice" hidden><p id="choice-text"></p><div id="choice-cards"></div></section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
